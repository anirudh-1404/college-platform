<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Brand Icon Badge -->
  <g transform="translate(4, 6)">
    <rect width="48" height="48" rx="14" fill="url(#grad1)" />
    <!-- Graduation Cap / Scope Emblem -->
    <path d="M24 14L37 21L24 28L11 21L24 14Z" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16 24V31C16 33.5 19.5 35 24 35C28.5 35 32 33.5 32 31V24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M37 21V30" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <circle cx="37" cy="31" r="1.5" fill="white"/>
  </g>

  <!-- Typography -->
  <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">
    <tspan fill="#0F172A">Vidya</tspan><tspan fill="#7C3AED">Scope</tspan>
  </text>
  
  <!-- Subtle Tagline Pill -->
  <text x="66" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94A3B8" letter-spacing="1.5">DISCOVER • COMPARE • SUCCEED</text>

  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
</svg>
